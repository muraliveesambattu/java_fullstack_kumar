<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // ES5 Versions of Functions 
        function sayHello1() { }
        const sayHello2 = function () { };
        const sayHello3 = function welcome() { };

        sayHello1();
        sayHello2();
        sayHello3();


        // ES6 - Arrow Function or Fat Arrow Function 
        const sayHello4 = () => {
            document.writeln("Welcome To ES6 Type of Function !!!")
        }
        // sayHello4()
    </script>
</body>

</html>
