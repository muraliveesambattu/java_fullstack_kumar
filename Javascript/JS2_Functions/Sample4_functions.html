<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function sayHello() {
            console.log("Hello, World!");
        }

        sayHello(); // Calling the function to execute its code

        //Immedietly Inovked Function Excution !!!
        (function (){
            document.writeln("I am from Self Invoking Function Excution !!!!")
        })();
    </script>
</body>
</html>
