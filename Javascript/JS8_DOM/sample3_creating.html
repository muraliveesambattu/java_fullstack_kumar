<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      table {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <table border="1">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Age</th>
          <th>Course</th>
          <th>Marks</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <script>
      const students = [
        {
          id: 1,
          name: "Rahul Sharma",
          age: 20,
          course: "Computer Science",
          marks: 82,
        },
        {
          id: 2,
          name: "Anjali Verma",
          age: 21,
          course: "Electronics",
          marks: 88,
        },
        {
          id: 3,
          name: "Kiran Kumar",
          age: 19,
          course: "Mechanical",
          marks: 75,
        },
        {
          id: 4,
          name: "Sneha Reddy",
          age: 22,
          course: "Information Technology",
          marks: 91,
        },
        {
          id: 5,
          name: "Arjun Patel",
          age: 20,
          course: "Civil Engineering",
          marks: 79,
        },
      ];

      for (i = 0; i < students.length; i++) {
        var myTr = document.createElement("tr");
        myTr.innerHTML = `  <td>${students[i].id}</td>
                            <td>${students[i].name}</td>
                            <td>${students[i].age}</td>
                            <td>${students[i].course}</td>
                            <td>${students[i].marks}</td>`;
        document.querySelector("tbody").append(myTr);
      }
    </script>
  </body>
</html>
