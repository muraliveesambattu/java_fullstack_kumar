<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Manager</title>
  <link rel="stylesheet" href="student-manager.css">
</head>
<body>
  <div class="container">
    <h2>Student Manager</h2>
    <form>
      <label for="student-name">Student Name</label>
      <input type="text" id="student-name" placeholder="Student Name">
      <label for="roll-number">Roll Number</label>
      <input type="text" id="roll-number" placeholder="Roll Number">
      <button>Add Student</button>
    </form>
    <table>
      <thead>
        <tr><th>Name</th><th>Roll No</th><th>Edit</th><th>Delete</th></tr>
      </thead>
      <tbody>
        <!-- Student rows here -->
        <tr>
          <td>John Doe</td>
          <td>101</td>
          <td><button>Edit</button></td>
          <td><button>Delete</button></td>
        </tr>
      </tbody>
    </table>
  </div>
  <script src="student-manager.js"></script>
</body>
</html>
