<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main {
            background: red;
            overflow: auto;
        }

        #left,
        #right {
            width: 150px;
            height: 150px;
            background: blue;
            margin: 5px;
            color: white;
        }
        #left{
            float: left;
        }
        #right{
            float: right;
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="left">
            <h2>Left</h2>
        </div>
        <div id="right">
            <h2>Right</h2>
        </div>
    </div>
</body>

</html>
