<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            background: lightcoral;
            overflow: auto;
        }
        .box{
            width: 150px;
            height: 150px;
            background: red;
            margin: 5px;
            /* float: left; */
            float: right    ;
        }
        /* dont follow previous elements float property  */
        h3{
            clear: both; 
        }
    </style>
</head>
<body>
    <div id="main">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>

        <h3>Welcome to Float topic !!</h3>
    </div>
</body>
</html>
